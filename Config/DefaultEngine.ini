GlobalDefaultGameMode=/Script/PiratesVsVikings.BRGameMode
GameInstanceClass=/Script/PiratesVsVikings.BRGameInstance

[/Script/Engine.RendererSettings]
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

[/Script/Engine.Engine]
bSmoothFrameRate=False

[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

; ---------------------------------------------------------------------------
; ONLINE: Epic Online Services (EOS) peer-to-peer. Players connect through Epic's free relays: no Steam, no VPN,
; no port forwarding. Everyone signs in with a free Epic account once (remembered after that).
; Fill in your IDs in the editor: Project Settings -> Plugins -> Epic Online Services (see docs/EOS_SETUP.md).
; If EOS isn't set up / can't start, the game falls back to plain IP networking (HOST GAME (LAN / direct IP) + JOIN IP still work).
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemEOS.NetDriverEOS]
bIsUsingP2PSockets=true

[OnlineSubsystem]
DefaultPlatformService=EOS
bHasVoiceEnabled=true

[OnlineSubsystemEOS]
bEnabled=true

[/Script/OnlineSubsystemEOS.EOSSettings]
DefaultArtifactName=BorderRun
bUseEAS=True
bUseEOSConnect=True
bUseEOSSessions=True
bEnableOverlay=True
bEnableSocialOverlay=True
bShouldEnforceBeingLaunchedByEGS=False
bMirrorStatsToEOS=False
bMirrorAchievementsToEOS=False
bMirrorPresenceToEAS=True
TickBudgetInMilliseconds=0
